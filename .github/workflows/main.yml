name: Main

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Run checks
        run: just check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: DEBUG fetch --help raw output
        run: |
          uv run python -c "
          from typer.testing import CliRunner
          from safaribooks.cli import app
          r = CliRunner().invoke(app, ['fetch', '--help'])
          print('exit_code:', r.exit_code)
          print('COLUMNS env:', repr(__import__('os').environ.get('COLUMNS')))
          import shutil
          print('terminal size:', shutil.get_terminal_size())
          print('=== repr(output) ===')
          print(repr(r.output))
          print('=== raw output ===')
          print(r.output)
          "

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy
